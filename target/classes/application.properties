# Nombre del microservicio
spring.application.name=ms-books-payments

# Base de datos H2 (en memoria)
spring.datasource.url=jdbc:h2:mem:paymentsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.h2.console.settings.web-allow-others=true
spring.sql.init.mode=always
spring.h2.console.settings.trace=false

# Puerto (opcional, pero claro)
server.port=8082

# ============================
# Eureka Client Configuration
# ============================

# Registrar este microservicio en Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# URL del servidor Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Configuración Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Personalizar el paquete base para escanear
springdoc.packages-to-scan=com.relato.msbookspayments.controller
springdoc.paths-to-match=/api/**

# Deshabilitar la autenticación en Swagger UI (si no usas seguridad)
springdoc.swagger-ui.csrf.enabled=false
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# Si quieres versionamiento de API
springdoc.api-docs.version=openapi_3_0
